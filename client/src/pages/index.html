<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Koset API Tester</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a; --panel: #111827; --muted: #94a3b8; --text: #e5e7eb;
      --accent: #22d3ee; --ok: #10b981; --err: #ef4444; --warn: #f59e0b;
      --card: #0b1220; --border: #1f2937;
    }
    body {
      margin:0; font-family: system-ui;
      background: linear-gradient(120deg,#0f172a,#0b1220);
      color:var(--text);
    }
    header { padding:20px; border-bottom:1px solid var(--border); }
    main { padding:20px; max-width: 1200px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(360px,1fr)); gap:20px; }
    .card {
      background: var(--panel);
      border:1px solid var(--border);
      padding:20px; border-radius:12px;
    }
    input, button {
      padding:10px; border-radius:8px;
      border:1px solid var(--border);
      background:var(--card); color:var(--text);
      width:100%; margin-top:6px;
    }
    button { background:var(--accent); color:#001419; font-weight:600; cursor:pointer; }
    .out {
      margin-top:10px; padding:10px; background:#0a0f1d;
      border:1px solid var(--border); border-radius:8px;
      font-family: monospace; white-space:pre-wrap; max-height:300px; overflow:auto;
    }
  </style>
</head>

<body>
<header>
  <h1>Koset API Tester</h1>
  <label>Backend URL:</label>
  <input id="serverUrl" type="url" placeholder="https://koset-agents-deploy.onrender.com" />
  <button id="saveServer">Save Server URL</button>
  <button id="pingBtn">Ping /health</button>
</header>

<main class="grid">

  <!-- Upload Section -->
  <section class="card">
    <h2>1) Upload Training & Dataset</h2>

    <label>Project Name</label>
    <input id="projectName" type="text" placeholder="default_project" />

    <label>Training Files</label>
    <input id="trainingFiles" type="file" multiple />

    <label>Dataset Name</label>
    <input id="datasetName" type="text" placeholder="default_dataset" />

    <label>Dataset Files</label>
    <input id="datasetFiles" type="file" multiple />

    <button id="uploadBtn">Upload</button>

    <div id="uploadOut" class="out"></div>
  </section>

  <!-- Analyze Section -->
  <section class="card">
    <h2>2) Estimate & Analyze</h2>

    <label>Source (GitHub, HuggingFace, JSON config, Raw .py URL)</label>
    <input id="sourceInput" type="text" placeholder="Optional — leave blank to use uploaded training files" />

    <label><input type="checkbox" id="useLLM" checked /> Use LLM Fallback</label>

    <button id="analyzeBtn">Estimate & Analyze</button>

    <div id="analyzeOut" class="out"></div>
  </section>

</main>

<script>
const LS = {
  server: 'koset_server',
  last: 'koset_last_upload'
};
const $ = id => document.getElementById(id);

(function initServer() {
  $('serverUrl').value = localStorage.getItem(LS.server) ||
                         'https://koset-agents-deploy.onrender.com';
})();

function server() {
  return ($('serverUrl').value || 'https://koset-agents-deploy.onrender.com')
         .replace(/\/+$/, '');
}

$('saveServer').onclick = () => {
  localStorage.setItem(LS.server, $('serverUrl').value);
  alert("Saved!");
};

$('pingBtn').onclick = async () => {
  try {
    const r = await fetch(server() + "/health");
    alert(await r.text());
  } catch {
    alert("Failed");
  }
};

/* --------------------- UPLOAD --------------------- */
$('uploadBtn').onclick = async () => {
  const out = $('uploadOut');
  out.textContent = "Uploading...";

  const fd = new FormData();
  fd.append("project_name", $('projectName').value || "default_project");
  fd.append("dataset_name", $('datasetName').value || "default_dataset");

  [...$('trainingFiles').files].forEach(f => fd.append("training_files", f));
  [...$('datasetFiles').files].forEach(f => fd.append("dataset_files", f));

  try {
    const res = await fetch(server() + "/upload", { method: "POST", body: fd });
    const data = await res.json();

    // Store training/dataset primary paths internally
    localStorage.setItem(LS.last, JSON.stringify({
      training_path: data.training?.training_primary_file || null,
      dataset_path: data.dataset?.dataset_primary_file || null
    }));

    out.textContent = JSON.stringify(data, null, 2);

  } catch(err) {
    out.textContent = "Error: " + err;
  }
};

/* --------------------- ANALYZE --------------------- */
$('analyzeBtn').onclick = async () => {
  const out = $('analyzeOut');
  out.textContent = "Analyzing...";

  const saved = JSON.parse(localStorage.getItem(LS.last) || "{}");

  const source = $('sourceInput').value.trim();
  const payload = { use_llm_fallback: $('useLLM').checked };

  if (source) {
    payload.source = source;
  } else {
    payload.training_path = saved.training_path;
  }

  if (saved.dataset_path) {
    payload.dataset_path = saved.dataset_path;
  }

  try {
    const res = await fetch(server() + "/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    out.textContent = JSON.stringify(await res.json(), null, 2);

  } catch (err) {
    out.textContent = "Error: " + err;
  }
};
</script>

</body>
</html>
